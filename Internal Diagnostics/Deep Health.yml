info:
  name: Deep Health
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/internal/health/deep"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  auth:
    type: bearer
    token: "{{mail_gateway_internal_secret}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
